<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin — Dashboard Iklim Kaltim</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f4f7f6 0%, #eaf2fb 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            background: #fff; border-radius: 14px; padding: 36px 34px;
            box-shadow: 0 8px 30px rgba(0,0,0,.12); width: 100%; max-width: 380px;
            border-top: 4px solid #3498db;
        }
        .login-brand { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 24px; }
        .login-brand img { height: 52px; }
        .login-brand h1 { font-size: 16px; margin: 0; color: #2c3e50; font-weight: 700; text-align: center; }
        .login-brand p { font-size: 12px; margin: 4px 0 0; color: #7f8c8d; text-align: center; }
        .login-badge {
            display: inline-block; margin-top: 8px; font-size: 11px; font-weight: 700;
            color: #3498db; background: #eaf4fd; padding: 3px 10px; border-radius: 12px;
            letter-spacing: .3px;
        }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; color: #555; margin-bottom: 6px; }
        .form-group input {
            width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 7px;
            font-size: 14px; color: #333; background: #fbfbfb;
        }
        .form-group input:focus { outline: none; border-color: #3498db; background: #fff; }
        .btn-login {
            width: 100%; background: #2c3e50; color: #fff; border: none; padding: 11px;
            border-radius: 7px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 6px;
            transition: background .2s;
        }
        .btn-login:hover { background: #3498db; }
        .error-msg {
            background: #fdecea; color: #c0392b; font-size: 12.5px; font-weight: 600;
            padding: 9px 12px; border-radius: 7px; margin-bottom: 16px; text-align: center;
        }
        .back-link { display: block; text-align: center; margin-top: 18px; font-size: 12.5px; color: #7f8c8d; text-decoration: none; }
        .back-link:hover { color: #3498db; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-brand">
            <img src="/static/logo.png" alt="Logo BMKG">
            <h1>Dashboard Curah Hujan Harian Kalimantan Timur</h1>
            <p>Stasiun Meteorologi Kelas II Aji Pangeran Tumenggung Pranoto</p>
            <span class="login-badge"> Login Admin</span>
        </div>

        {% if error %}
        <div class="error-msg">⚠️ {{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            <input type="hidden" name="next" value="{{ next }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-login">Masuk</button>
        </form>

        <a href="/" class="back-link">&larr; Kembali ke Beranda</a>
    </div>
</body>
</html>
